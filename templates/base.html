<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Student Productivity Hub{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 420px;
            margin: 4rem auto;
            background: #fff;
            border: 1px solid #dce3eb;
            border-radius: 8px;
            padding: 1.5rem;
        }
        h1 { margin-top: 0; }
        form p { margin-bottom: 0.9rem; }
        input {
            width: 100%;
            padding: 0.55rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.7rem;
            border: 0;
            background: #1f6feb;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
        }
        .messages {
            list-style: none;
            padding: 0;
            margin: 0 0 1rem 0;
        }
        .messages li {
            background: #e8f4ff;
            border: 1px solid #b8dcff;
            padding: 0.6rem;
            border-radius: 6px;
            margin-bottom: 0.4rem;
        }
        .help-text {
            margin-top: 1rem;
            text-align: center;
        }
        .errors {
            color: #a30000;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <main class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
